<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قراءة الكتاب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            overflow: hidden;
            height: 100%;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* زر الرجوع */
        .back-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover, .back-btn:active {
            background: rgba(0,0,0,0.8);
            transform: scale(1.1);
        }
        
        /* رقم الصفحة */
        .page-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
        }
        
        /* منطقة عرض الصورة */
        .image-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            cursor: grab;
        }
        
        .image-container:active {
            cursor: grabbing;
        }
        
        .page-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
            will-change: transform;
        }
        
        /* مؤشر التحميل */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .loader.show {
            opacity: 1;
        }
        
        /* تأثير الانتقال بين الصفحات */
        .slide-left {
            animation: slideLeft 0.3s ease;
        }
        
        .slide-right {
            animation: slideRight 0.3s ease;
        }
        
        @keyframes slideLeft {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideRight {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='toc.html'" title="الرجوع للفهرس">↩</button>
    
    <div class="image-container" id="imageContainer">
        <img id="pageImage" class="page-image" src="" alt="صفحة الكتاب" draggable="false">
        <div class="loader" id="loader">جاري التحميل...</div>
    </div>
    
    <div class="page-indicator" id="pageInfo">صفحة ١</div>

    <script>
        const MIN_SCALE = 1;
        const MAX_SCALE = 5;
        
        let currentPage = 1;
        let totalPages = 346;
        
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        
        let isDragging = false;
        let startX = 0, startY = 0;
        let startTranslateX = 0, startTranslateY = 0;
        
        let initialDistance = 0;
        let initialScale = 1;
        let lastTapTime = 0;
        
        // متغيرات السحب للتنقل
        let swipeStartX = 0;
        let swipeThreshold = 50; // الحد الأدنى للسحب
        
        const container = document.getElementById('imageContainer');
        const image = document.getElementById('pageImage');
        const loader = document.getElementById('loader');
        const pageInfo = document.getElementById('pageInfo');
        
        const urlParams = new URLSearchParams(window.location.search);
        const startPage = urlParams.get('page');
        if (startPage) currentPage = parseInt(startPage);
        
        function updatePage() {
            loader.classList.add('show');
            const imgSrc = `a${currentPage}.png`;
            resetZoom();
            
            const tempImg = new Image();
            tempImg.onload = function() {
                image.src = imgSrc;
                loader.classList.remove('show');
            };
            tempImg.onerror = function() {
                loader.classList.remove('show');
            };
            tempImg.src = imgSrc;
            
            pageInfo.textContent = `صفحة ${toArabicNum(currentPage - 2)}`;
        }
        
        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                image.classList.add('slide-left');
                setTimeout(() => image.classList.remove('slide-left'), 300);
                updatePage();
            }
        }
        
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                image.classList.add('slide-right');
                setTimeout(() => image.classList.remove('slide-right'), 300);
                updatePage();
            }
        }
        
        function updateTransform() {
            image.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }
        
        function constrainPosition() {
            if (scale <= 1) { translateX = 0; translateY = 0; return; }
            const containerRect = container.getBoundingClientRect();
            const imgWidth = image.naturalWidth * scale;
            const imgHeight = image.naturalHeight * scale;
            const maxTranslateX = Math.max(0, (imgWidth - containerRect.width) / 2);
            const maxTranslateY = Math.max(0, (imgHeight - containerRect.height) / 2);
            translateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, translateX));
            translateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, translateY));
        }
        
        function resetZoom() {
            scale = 1; translateX = 0; translateY = 0;
            updateTransform();
        }
        
        function zoomAtPoint(clientX, clientY, factor) {
            const rect = container.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
            if (newScale === scale) return;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const dx = x - centerX - translateX;
            const dy = y - centerY - translateY;
            const scaleChange = newScale / scale;
            translateX = translateX - dx * (scaleChange - 1);
            translateY = translateY - dy * (scaleChange - 1);
            scale = newScale;
            constrainPosition();
            updateTransform();
        }
        
        // ============ أحداث الماوس ============
        container.addEventListener('mousedown', function(e) {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            swipeStartX = e.clientX;
            startTranslateX = translateX;
            startTranslateY = translateY;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            if (scale > 1) {
                // تحريك الصورة عند التكبير
                translateX = startTranslateX + (e.clientX - startX);
                translateY = startTranslateY + (e.clientY - startY);
                constrainPosition();
                updateTransform();
            }
        });
        
        document.addEventListener('mouseup', function(e) {
            if (!isDragging) return;
            isDragging = false;
            
            // التنقل بين الصفحات عند السحب (فقط إذا لم تكن مكبرة)
            if (scale === 1) {
                const swipeDistance = e.clientX - swipeStartX;
                if (Math.abs(swipeDistance) > swipeThreshold) {
                    if (swipeDistance > 0) {
                        prevPage(); // سحب لليمين = الصفحة السابقة
                    } else {
                        nextPage(); // سحب لليسار = الصفحة التالية
                    }
                }
            }
        });
        
        // عجلة الماوس للتكبير
        container.addEventListener('wheel', function(e) {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.15 : 0.87;
            zoomAtPoint(e.clientX, e.clientY, factor);
        }, { passive: false });
        
        // النقر المزدوج للتكبير
        container.addEventListener('dblclick', function(e) {
            if (scale > 1) resetZoom();
            else zoomAtPoint(e.clientX, e.clientY, 2.5);
        });
        
        // ============ أحداث اللمس (للجوال) ============
        container.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                const now = Date.now();
                if (now - lastTapTime < 300) {
                    const touch = e.touches[0];
                    if (scale > 1) resetZoom();
                    else zoomAtPoint(touch.clientX, touch.clientY, 2.5);
                    e.preventDefault();
                    return;
                }
                lastTapTime = now;
                
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                swipeStartX = e.touches[0].clientX;
                startTranslateX = translateX;
                startTranslateY = translateY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialDistance = getDistance(e.touches[0], e.touches[1]);
                initialScale = scale;
            }
            e.preventDefault();
        }, { passive: false });
        
        container.addEventListener('touchmove', function(e) {
            if (e.touches.length === 1 && isDragging) {
                if (scale > 1) {
                    // تحريك الصورة عند التكبير
                    translateX = startTranslateX + (e.touches[0].clientX - startX);
                    translateY = startTranslateY + (e.touches[0].clientY - startY);
                    constrainPosition();
                    updateTransform();
                }
            } else if (e.touches.length === 2) {
                const currentDistance = getDistance(e.touches[0], e.touches[1]);
                const factor = currentDistance / initialDistance;
                const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, initialScale * factor));
                if (newScale !== scale) {
                    const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    zoomAtPoint(centerX, centerY, newScale / scale);
                }
            }
            e.preventDefault();
        }, { passive: false });
        
        container.addEventListener('touchend', function(e) {
            if (e.touches.length === 0 && isDragging) {
                isDragging = false;
                
                // التنقل بين الصفحات عند السحب (فقط إذا لم تكن مكبرة)
                if (scale === 1 && e.changedTouches.length > 0) {
                    const swipeDistance = e.changedTouches[0].clientX - swipeStartX;
                    if (Math.abs(swipeDistance) > swipeThreshold) {
                        if (swipeDistance > 0) {
                            prevPage();
                        } else {
                            nextPage();
                        }
                    }
                }
            }
        });
        
        function getDistance(t1, t2) {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        function toArabicNum(num) {
            const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return num.toString().replace(/\d/g, d => arabicDigits[d]);
        }
        
        // دعم لوحة المفاتيح
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') nextPage();
            else if (e.key === 'ArrowRight') prevPage();
            else if (e.key === '0') resetZoom();
        });
        
        updatePage();
    </script>
</body>
</html>
